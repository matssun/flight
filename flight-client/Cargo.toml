[package]
name = "flight-client"
description = "Flight: the dashboard backend that reads an orchestrator"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flight-classify = { path = "../flight-classify" }
flight-proto = { path = "../flight-proto" }
flight-state = { path = "../flight-state" }
flight-tmux = { path = "../flight-tmux" }
flight-transport = { path = "../flight-transport" }
flight-trust = { path = "../flight-trust" }
flight-ui = { path = "../flight-ui" }
crossterm = { workspace = true }
ratatui = { workspace = true }
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
flight-present = { path = "../flight-present" }
rustix = { version = "0.38", features = ["event", "stdio", "fs", "pipe", "termios"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
portable-pty = "0.8"
flight-control = { path = "../flight-control" }
flight-orchestrator = { path = "../flight-orchestrator" }
flight-node = { path = "../flight-node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
