//
// Flight wire protocol v1. THIS FILE IS THE NORMATIVE SCHEMA.
//
// The Rust types in src/ are hand-written `prost` messages (so builds need no protoc), and
// tests/schema.rs proves they agree with this file: message names, field names, numbers,
// types, oneofs and enum values. Change both together.
//
// Liveness vs state: a node's connection status (Online/Stale/Disconnected) is separate from its
// panes' semantic state, which stays as last reported while the node is away.
//
// Rules: never renumber or reuse a number (retire it with `reserved`); only add. Enum zero
// is always UNSPECIFIED and is never a valid value on the wire. The semantic boundary: the
// wire carries semantic pane/node state only, never classifier internals.

syntax = "proto3";

package flight.v1;

// ---------------------------------------------------------------------------------------
// Common

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message PaneRefMsg {
  string host = 1;
  string server = 2;
  string pane = 3;
}

enum AgentKindCode {
  AGENT_KIND_CODE_UNSPECIFIED = 0;
  AGENT_KIND_CODE_CLAUDE = 1;
  AGENT_KIND_CODE_CODEX = 2;
  AGENT_KIND_CODE_OPEN_CODE = 3;
  AGENT_KIND_CODE_PI = 4;
  AGENT_KIND_CODE_OTHER = 5;
}

enum StateCode {
  STATE_CODE_UNSPECIFIED = 0;
  STATE_CODE_PERMIT = 1;
  STATE_CODE_QUESTION = 2;
  STATE_CODE_DONE = 3;
  STATE_CODE_BUSY = 4;
  STATE_CODE_IDLE = 5;
  STATE_CODE_SHELL = 6;
  STATE_CODE_DOWN = 7;
}

enum SourceCode {
  SOURCE_CODE_UNSPECIFIED = 0;
  SOURCE_CODE_HOOK = 1;
  SOURCE_CODE_EVENT = 2;
  SOURCE_CODE_SCRAPE = 3;
  SOURCE_CODE_TITLE = 4;
  SOURCE_CODE_TIMEOUT = 5;
  SOURCE_CODE_SYNTHESIZED_DONE = 6;
  SOURCE_CODE_DEFAULT = 7;
  SOURCE_CODE_GLYPH = 8;
}

enum ErrorKindCode {
  ERROR_KIND_CODE_UNSPECIFIED = 0;
  ERROR_KIND_CODE_TMUX_UNAVAILABLE = 1;
  ERROR_KIND_CODE_TMUX_SERVER_UNAVAILABLE = 2;
  ERROR_KIND_CODE_REMOTE_COMMAND_FAILED = 3;
  ERROR_KIND_CODE_UNSUPPORTED = 4;
  ERROR_KIND_CODE_NOT_AUTHORIZED = 5;
  ERROR_KIND_CODE_PROTOCOL_MISMATCH = 6;
  ERROR_KIND_CODE_UNKNOWN_PANE = 7;
  ERROR_KIND_CODE_INVALID_REQUEST = 8;
  ERROR_KIND_CODE_NODE_UNREACHABLE = 9;
  // The pane id exists but is no longer the process the request was about.
  ERROR_KIND_CODE_PANE_CHANGED = 10;
  // A limit was reached (for example too many open terminals); nothing was created.
  ERROR_KIND_CODE_BUSY = 11;
  // CreateSession: a session of that name already exists on the node; it was not touched.
  ERROR_KIND_CODE_ALREADY_EXISTS = 12;
  // CreateSession: the directory does not exist on the node or is not a directory.
  ERROR_KIND_CODE_INVALID_DIRECTORY = 13;
  // CreateSession: the program could not be found on the node, or ended as soon as it started.
  ERROR_KIND_CODE_PROGRAM_UNAVAILABLE = 14;
  // The workspace named by a request is not known to the node (or orchestrator) asked.
  ERROR_KIND_CODE_UNKNOWN_WORKSPACE = 15;
}

// What a new session runs. A closed set: the wire never carries a command line.
enum ProgramCode {
  PROGRAM_CODE_UNSPECIFIED = 0;
  // The `claude` found on the node's own PATH.
  PROGRAM_CODE_CLAUDE = 1;
  // The node's normal shell: what tmux starts for a session created by hand.
  PROGRAM_CODE_SHELL = 2;
  // `claude` started so that it does not ask before acting (`--dangerously-skip-permissions`).
  PROGRAM_CODE_CLAUDE_SKIP_PERMISSIONS = 3;
}

// What a surface of a workspace is. A closed set: a new kind is a new number, and a peer that
// does not know it refuses the message rather than guessing.
enum SurfaceKindCode {
  SURFACE_KIND_CODE_UNSPECIFIED = 0;
  // The workspace's coding agent (Claude, Codex, ...). Which one is `agent_kind`.
  SURFACE_KIND_CODE_AGENT = 1;
  // A shell in the workspace's root directory.
  SURFACE_KIND_CODE_SHELL = 2;
}

// The health of a saved workspace as its node sees it (ADR-008).
enum SavedHealthCode {
  SAVED_HEALTH_CODE_UNSPECIFIED = 0;
  // Running with every saved surface.
  SAVED_HEALTH_CODE_RUNNING = 1;
  // Running, with some saved surfaces absent.
  SAVED_HEALTH_CODE_PARTIAL = 2;
  // Not running; its root is usable, so it could be started.
  SAVED_HEALTH_CODE_STOPPED = 3;
  // Cannot be acted on: its root is unusable or unverified, or the match is ambiguous.
  SAVED_HEALTH_CODE_BLOCKED = 4;
}

// What looking at a saved workspace's root found (ADR-008). The failure cases are kept apart
// because they call for different things from the user.
enum SavedRootCode {
  SAVED_ROOT_CODE_UNSPECIFIED = 0;
  // Present and the directory that was saved.
  SAVED_ROOT_CODE_VERIFIED = 1;
  // Present; nothing was recorded about it yet.
  SAVED_ROOT_CODE_FIRST_SIGHTING = 2;
  // Absent, with its parent present and readable.
  SAVED_ROOT_CODE_MISSING = 3;
  SAVED_ROOT_CODE_NOT_A_DIRECTORY = 4;
  SAVED_ROOT_CODE_PERMISSION_DENIED = 5;
  // Could not be confirmed either way (for example an unmounted volume).
  SAVED_ROOT_CODE_UNVERIFIED = 6;
  // Present, but not demonstrably the directory that was saved.
  SAVED_ROOT_CODE_CHANGED = 7;
}

// What a user asks of a saved workspace (ADR-008). None of these creates, repairs or deletes
// anything on the filesystem.
enum SavedActionCode {
  SAVED_ACTION_CODE_UNSPECIFIED = 0;
  // Look again now instead of at the next periodic check.
  SAVED_ACTION_CODE_RETRY = 1;
  // Forget the saved reference. Running processes and files are not touched.
  SAVED_ACTION_CODE_REMOVE = 2;
  // Start the workspace again (a replacement process) in its verified root.
  SAVED_ACTION_CODE_RESTORE = 3;
  // The directory now at the path is the one meant: remember it as the saved identity.
  SAVED_ACTION_CODE_ACCEPT_ROOT = 4;
  // Point the saved workspace at another directory (`root`).
  SAVED_ACTION_CODE_SET_ROOT = 5;
  // An imported definition is trusted: it may now start processes.
  SAVED_ACTION_CODE_TRUST = 6;
}

// Why a terminal session ended (ADR-003).
enum ExitReasonCode {
  EXIT_REASON_CODE_UNSPECIFIED = 0;
  EXIT_REASON_CODE_CLIENT_EXITED = 1;
  EXIT_REASON_CODE_START_FAILED = 2;
  EXIT_REASON_CODE_CLOSED_BY_UI = 3;
  EXIT_REASON_CODE_NODE_LOST = 4;
  EXIT_REASON_CODE_STALLED = 5;
  EXIT_REASON_CODE_REVOKED = 6;
  EXIT_REASON_CODE_SHUTDOWN = 7;
  EXIT_REASON_CODE_LEASE_EXPIRED = 8;
}

enum NodeStatusCode {
  NODE_STATUS_CODE_UNSPECIFIED = 0;
  NODE_STATUS_CODE_ONLINE = 1;
  NODE_STATUS_CODE_DISCONNECTED = 2;
  NODE_STATUS_CODE_STALE = 3;
}

enum RoleCode {
  ROLE_CODE_UNSPECIFIED = 0;
  ROLE_CODE_NODE = 1;
  ROLE_CODE_UI = 2;
}

enum AvailabilityCode {
  AVAILABILITY_CODE_UNSPECIFIED = 0;
  AVAILABILITY_CODE_AVAILABLE = 1;
  AVAILABILITY_CODE_TMUX_UNAVAILABLE = 2;
  AVAILABILITY_CODE_NO_SERVER = 3;
  AVAILABILITY_CODE_FAILED = 4;
}

// One agent pane's resolved, externally visible state. No terminal contents. Fields that
// change on every poll (observation time, terminal title) are deliberately absent.
message PaneState {
  reserved 7, 13;
  PaneRefMsg pane_ref = 1;
  AgentKindCode agent_kind = 2;
  StateCode state = 3;
  SourceCode source = 4;
  // The winning rule id, when a rule decided it.
  string rule_id = 5;
  // A short human reason, e.g. "finished while away".
  string why = 6;
  // Seconds since the epoch at which `state` last changed.
  uint64 changed_at = 8;
  string session = 9;
  string window = 10;
  string path = 11;
  string command = 12;
  // The pane's process id: the pane incarnation a control action must name. 0 from a node
  // that predates it.
  uint32 pid = 14;
  // The workspace this pane is a surface of, and which surface. Empty from a node that predates
  // workspaces (the pane is then a single-surface workspace around itself). Ids are minted by
  // the node and kept in its backend; they are not backend ids and not display names.
  string workspace_id = 15;
  string surface_id = 16;
  // UNSPECIFIED from a node that predates workspaces.
  SurfaceKindCode surface_kind = 17;
  // The workspace's root directory on the node: where its surfaces start.
  string workspace_root = 18;
}

// One workspace a node has saved (ADR-008), with how it stands now. Declared intent plus the
// node's own reading of it; the node is the only party that can verify the root.
message SavedWorkspace {
  // The stable saved identity (not a runtime workspace id).
  string config_key = 1;
  string name = 2;
  // The configured root directory on the node.
  string root = 3;
  SavedHealthCode health = 4;
  SavedRootCode root_state = 5;
  // Failure information, plain text, bounded.
  string detail = 6;
  // The running workspace that realizes it, when one does.
  string workspace_id = 7;
  // The definition was imported, not made on this node: it starts nothing on its own.
  bool imported = 8;
}

// The node's complete list of saved workspaces. Replaces the previous list.
message SavedWorkspaces {
  repeated SavedWorkspace items = 1;
}

message ServerStatus {
  string server = 1;
  AvailabilityCode availability = 2;
  string detail = 3;
}

message ErrorInfo {
  ErrorKindCode kind = 1;
  string message = 2;
}

message Heartbeat {
  uint64 seq = 1;
}

// ---------------------------------------------------------------------------------------
// Node <-> orchestrator: one long-lived bidirectional stream, dialled by the node.
//
// Replication: Snapshot(incarnation = N), then Delta(N, 1), Delta(N, 2), ... A gap, a
// duplicate, a foreign incarnation or a reconnect means "request a fresh snapshot"; there
// is no repair. A snapshot alone is always sufficient; a delta is never required.
// `incarnation` is 16 random bytes, fresh per producer process, never persisted.

message NodeHello {
  ProtocolVersion version = 1;
  // Key fingerprint; stable. The display name is mutable presentation.
  string node_id = 2;
  string display_name = 3;
  repeated string capabilities = 4;
  repeated string servers = 5;
}

message OrchestratorHello {
  ProtocolVersion version = 1;
  repeated string accepted_capabilities = 2;
  uint32 heartbeat_interval_secs = 3;
}

message Snapshot {
  bytes incarnation = 1;
  repeated PaneState panes = 2;
  repeated ServerStatus servers = 3;
  // Empty from a node that predates saved workspaces (saved_workspaces_v1).
  repeated SavedWorkspace saved = 4;
}

message Delta {
  bytes incarnation = 1;
  uint64 sequence = 2;
  oneof change {
    PaneState pane_upsert = 3;
    PaneRefMsg pane_removed = 4;
    ServerStatus server_status = 5;
    // Only sent when the orchestrator accepted saved_workspaces_v1.
    SavedWorkspaces saved = 6;
  }
}

message Command {
  message GetPreview {
    PaneRefMsg pane_ref = 1;
    uint32 lines = 2;
  }
  // Make the pane the active pane of its window and its window the current one of its
  // session, on the node's own tmux server; never touches a tmux client (ADR-003).
  // Tag 2 was an unguarded SwitchPane that no node offered; it is retired.
  message RevealPane {
    PaneRefMsg pane_ref = 1;
    // The pane process the caller was looking at; the node refuses if it changed.
    uint32 expected_pid = 2;
  }
  // Open an interactive terminal onto the pane: the node runs a tmux client in a PTY it owns,
  // guarded by expected_pid (ADR-003). The caller never chooses terminal_id: the orchestrator
  // mints it and hands it to the node (empty from a UI, 16 bytes toward a node).
  message OpenTerminal {
    PaneRefMsg pane_ref = 1;
    uint32 expected_pid = 2;
    uint32 cols = 3;
    uint32 rows = 4;
    // The user's TERM: 1 to 32 bytes of [A-Za-z0-9._-].
    string term = 5;
    bytes terminal_id = 6;
  }
  message SendInput {
    PaneRefMsg pane_ref = 1;
    string text = 2;
    bool enter = 3;
  }
  message KillPane {
    PaneRefMsg pane_ref = 1;
  }
  // A new session on a node (create_session_v1); the node decides how to realize it. `name` is 1 to 64
  // bytes of [A-Za-z0-9_-] starting with a letter, digit or underscore; `dir` is an absolute
  // path or `~`-relative (expanded on the node) of at most 4096 bytes. Tag 5 of this oneof was
  // an earlier CreateSession that carried a free-form command line; it is retired.
  message CreateSession {
    string host = 1;
    reserved 2;
    string name = 3;
    string dir = 4;
    ProgramCode program = 5;
  }
  // A new surface for an existing workspace. The workspace fixes the host and the directory, so
  // the request carries neither: the orchestrator routes by the workspace id and the node
  // resolves the rest from the workspace itself (create_surface_v1). A workspace has at most
  // one surface of each kind; asking for a second is refused with ALREADY_EXISTS.
  message CreateSurface {
    string workspace_id = 1;
    SurfaceKindCode kind = 2;
  }
  // An operation on a workspace a node has saved (saved_actions_v1). Routed to `host`; the node
  // finds the saved workspace by `config_key` among its own and refuses any other.
  message SavedAction {
    string host = 1;
    string config_key = 2;
    SavedActionCode action = 3;
    // Only for SET_ROOT: an absolute path or `~`-relative, at most 4096 bytes.
    string root = 4;
  }
  reserved 2, 5;
  oneof kind {
    GetPreview get_preview = 1;
    SendInput send_input = 3;
    KillPane kill_pane = 4;
    RevealPane reveal_pane = 6;
    OpenTerminal open_terminal = 7;
    CreateSession create_session = 8;
    CreateSurface create_surface = 9;
    SavedAction saved_action = 10;
  }
}

message Request {
  uint64 request_id = 1;
  Command command = 2;
}

message Preview {
  string text = 1;
  // Seconds since the epoch.
  uint64 captured_at = 2;
}

message Response {
  // The request succeeded and has no payload.
  message Done {}
  uint64 request_id = 1;
  oneof result {
    Done done = 2;
    Preview preview = 3;
    ErrorInfo error = 4;
    TerminalOpened terminal = 5;
  }
}

// The answer to a successful OpenTerminal: the id both ends attach with.
message TerminalOpened {
  bytes terminal_id = 1;
}

message NodeFrame {
  oneof body {
    NodeHello hello = 1;
    Heartbeat heartbeat = 2;
    Snapshot snapshot = 3;
    Delta delta = 4;
    Response response = 5;
  }
}

message ResyncRequest {
  string reason = 1;
}

message Goodbye {
  ErrorKindCode reason = 1;
  string message = 2;
}

message OrchestratorFrame {
  oneof body {
    OrchestratorHello hello = 1;
    Heartbeat heartbeat = 2;
    ResyncRequest resync = 3;
    Request request = 4;
    Goodbye goodbye = 5;
  }
}

// ---------------------------------------------------------------------------------------
// UI <-> orchestrator: a separate interface. A UI consumes state and issues operator
// commands; it can never publish node state.

message NodeView {
  string node_id = 1;
  string display_name = 2;
  NodeStatusCode status = 3;
  repeated ServerStatus servers = 4;
  repeated PaneState panes = 5;
  repeated SavedWorkspace saved = 6;
}

message FleetSnapshot {
  bytes incarnation = 1;
  repeated NodeView nodes = 2;
}

message NodeStatusChanged {
  string node_id = 1;
  NodeStatusCode status = 2;
}

message NodeServerStatus {
  string node_id = 1;
  ServerStatus status = 2;
}

message NodeRemoved {
  string node_id = 1;
}

// A node's saved workspaces changed: replaces its whole list.
message NodeSavedWorkspaces {
  string node_id = 1;
  repeated SavedWorkspace items = 2;
}

message FleetDelta {
  bytes incarnation = 1;
  uint64 sequence = 2;
  oneof change {
    // Replaces the whole node entry, including its panes.
    NodeView node_upsert = 3;
    NodeStatusChanged node_status = 4;
    PaneState pane_upsert = 5;
    PaneRefMsg pane_removed = 6;
    NodeServerStatus server_status = 7;
    NodeRemoved node_removed = 8;
    NodeSavedWorkspaces node_saved = 9;
  }
}

// Start receiving the fleet: a FleetSnapshot, then FleetDeltas.
message Subscribe {}

// A UI's terminal presentation is alive (ADR-004). Sent on the UI's control stream, never on
// the terminal stream, so terminal backpressure cannot delay it. The orchestrator ignores it
// unless the id is a live terminal bound to this UI's authenticated identity.
message TerminalLease {
  bytes terminal_id = 1;
}

message UiRequest {
  oneof body {
    Subscribe subscribe = 1;
    Request command = 2;
    TerminalLease terminal_lease = 3;
  }
}

message UiEvent {
  oneof body {
    FleetSnapshot snapshot = 1;
    FleetDelta delta = 2;
    Response response = 3;
  }
}

// ---------------------------------------------------------------------------------------
// Enrollment and the gRPC service (HTTP/2 over mutual TLS 1.3, identities pinned by
// fingerprint). `Enroll` is the only call an authenticated but not yet authorized identity
// may make; the two streams require an enabled entry in the orchestrator's trust store.

// Join the fleet. The identity enrolled is the client certificate the request arrived
// under; the token only authorizes the join. Failures are indistinguishable to the peer.
message EnrollRequest {
  string token = 1;
  string display_name = 2;
  RoleCode role = 3;
}

message EnrollResponse {
  string node_id = 1;
  string orchestrator_id = 2;
}

// The two ends of a terminal stream (ADR-003). Each dials the orchestrator on its own
// connection; the orchestrator splices them and never interprets `payload`.
message TerminalAttach {
  bytes terminal_id = 1;
}
message TerminalData {
  bytes payload = 1;
}
message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}
message TerminalExit {
  ExitReasonCode reason = 1;
  int32 status = 2;
}
message TerminalClose {}
message TerminalFrame {
  oneof body {
    TerminalAttach attach = 1;
    TerminalData data = 2;
    TerminalResize resize = 3;
    TerminalExit exit = 4;
    TerminalClose close = 5;
  }
}

service Flight {
  // A node's one long-lived stream, dialled by the node.
  rpc NodeConnect(stream NodeFrame) returns (stream OrchestratorFrame);
  // A UI's stream.
  rpc UiConnect(stream UiRequest) returns (stream UiEvent);
  // A terminal's node end, dialled by the node after OpenTerminal.
  rpc TerminalNode(stream TerminalFrame) returns (stream TerminalFrame);
  // A terminal's UI end, dialled by the UI after TerminalOpened.
  rpc TerminalUi(stream TerminalFrame) returns (stream TerminalFrame);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}
