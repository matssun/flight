# Flight — Cargo workspace root
#
# A Rust tmux session manager with an agent dashboard. Combines the session-source
# model of sesh (Go) with the agent-state dashboard of Fleet (TypeScript).
# See docs/adr/ADR-001-architecture.md.

[workspace]
resolver = "2"
members = [
    "flight-tmux",     # tmux IPC: list-panes, capture-pane, switch/attach/kill
    "flight-classify", # Pure classifier: Observation -> Classification (ordered rule manifests, with provenance)
    "flight-proto",    # Wire protocol: node/orchestrator/UI messages, versioning, validation (no I/O)
    "flight-node",     # Node: observation adapter, NodeCore (state, Tracking, snapshot/delta), node session
    "flight-state",    # Agent state engine: hook + event + scrape fusion, 7-state model
    "flight-control",  # Host registry: routes PaneRef to a runner per host (local, SSH), typed host errors
    "flight-sessions", # Session sources (tmux, zoxide, config, tmuxinator), dedup, naming, connect
    "flight-ui",       # Dashboard: snapshot, pure view model, ratatui rendering, terminal loop
    "flight",          # The binary
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"
authors = ["Mats Sundvall"]
repository = "https://github.com/matssun/flight"

[workspace.dependencies]
regex = "1"
ratatui = "0.29"
crossterm = "0.28"
