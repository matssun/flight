[package]
name = "flight-node"
description = "Flight: node (local observation, authoritative pane state, Tracking, snapshot/delta replication)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flight-classify = { path = "../flight-classify" }
flight-proto = { path = "../flight-proto" }
flight-state = { path = "../flight-state" }
flight-tmux = { path = "../flight-tmux" }
flight-workspaces = { path = "../flight-workspaces" }
getrandom = "0.2"
portable-pty = "0.8"
# The terminal settings of the PTY (portable-pty already depends on it, at this version).
nix = { version = "0.25", default-features = false, features = ["term"] }
