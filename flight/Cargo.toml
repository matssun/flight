[package]
name = "flight"
description = "Flight: tmux session manager with an agent dashboard"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flight-tmux = { path = "../flight-tmux" }
flight-control = { path = "../flight-control" }
flight-state = { path = "../flight-state" }
flight-ui = { path = "../flight-ui" }
flight-client = { path = "../flight-client" }
flight-node = { path = "../flight-node" }
flight-proto = { path = "../flight-proto" }
flight-transport = { path = "../flight-transport" }
flight-trust = { path = "../flight-trust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
flight-orchestrator = { path = "../flight-orchestrator" }

[dev-dependencies]
portable-pty = "0.8"
